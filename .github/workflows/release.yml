name: build-release

# 手动触发（填版本号）或推送 v* 标签时自动构建并发布 Release。
# 产物：Windows 安装包（NSIS）+ Go 引擎独立包 + 桌面端渲染层更新包。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 v2.1.0）'
        required: true
        default: 'v2.1.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build backend
        shell: bash
        run: |
          go build -trimpath -ldflags "-X main.Version=${{ steps.ver.outputs.version }}" -o dist/ximo-agent.exe ./cmd/ximo-agent/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 前端的包管理器是 pnpm（frontend/pnpm-lock.yaml 是唯一的锁文件）。
      # 这里用 pnpm 而不是 npm ci：依赖只维护一份锁文件，避免
      # package-lock.json 与 pnpm-lock.yaml 各自漂移、CI 拿旧锁文件装新依赖
      # 直接失败（v2.3.0 的第一次 tag 构建正是这样失败的）。
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: Frontend unit tests
        working-directory: frontend
        run: pnpm test

      - name: Build renderer/main/preload
        working-directory: frontend
        run: pnpm exec electron-vite build

      - name: Build installer
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_SIGNING: 'false'
        run: pnpm exec electron-builder --win --publish never

      - name: Package backend zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ximo-agent.exe,migrations,config.default.json -DestinationPath "dist/ximo-agent-${{ steps.ver.outputs.version }}.zip" -Force

      - name: Package frontend update zip
        shell: pwsh
        run: |
          Compress-Archive -Path frontend/out/*,frontend/package.json -DestinationPath "ximo-agent-frontend-${{ steps.ver.outputs.version }}.zip" -Force

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: XimoAgent ${{ steps.ver.outputs.version }}
          body_path: docs/release-notes-${{ steps.ver.outputs.version }}.md
          target_commitish: ${{ github.sha }}
          files: |
            frontend/release/*.exe
            dist/ximo-agent-*.zip
            ximo-agent-frontend-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
